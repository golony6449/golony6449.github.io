[book]
title = "웹 개발자의 ESP32 도전기"
description = "터치 화면이 달린 ESP32-S3 보드 하나로 FreeRTOS의 속을 들여다보고, 첫 로봇으로 가는 길을 기록한 일대기"
authors = ["Park SeongHeum"]
language = "ko"
src = "src"

[output.html]
site-url = "https://golony6449.github.io/esp32/"
git-repository-url = "https://github.com/golony6449/golony6449.github.io"
edit-url-template = "https://github.com/golony6449/golony6449.github.io/edit/main/books/esp32/src/{path}"
default-theme = "light"
preferred-dark-theme = "navy"

[output.html.search]
enable = true
